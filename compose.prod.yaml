services:
  # Base de datos PostgreSQL
  db_service:
    image: postgres:17.5
    container_name: intelliagent_db
    restart: unless-stopped
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=db-password
      - POSTGRES_DB=mydb
    volumes:
      - dc_managed_db_volume:/var/lib/postgresql/data
    networks:
      - intelliagent_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API con FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intelliagent_backend
    restart: unless-stopped
    ports:
      - 8080:8000
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      - PORT=8000
      - MY_PROJECT=IntelliAgent
    env_file:
      - .env
    depends_on:
      db_service:
        condition: service_healthy
    networks:
      - intelliagent_network

  # Frontend con React
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: intelliagent_frontend
    restart: unless-stopped
    ports:
      - 80:80
      - 3000:80
    depends_on:
      - backend
    networks:
      - intelliagent_network
    environment:
      - VITE_API_URL=/api

networks:
  intelliagent_network:
    driver: bridge

volumes:
  dc_managed_db_volume:
